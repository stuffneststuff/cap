<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Cognitive CAPTCHA Simulator</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"
    ></script>


    <!-- Main reCAPTCHA Checkbox -->
    <div class="recaptcha-container" onclick="handleCaptchaClick()">
        <div class="flex items-center flex-grow">
            <div class="checkbox-input" id="recaptcha-checkbox">
                <span id="check-icon" class="check-icon">&#10003;</span>
            </div>
            <span class="text-gray-700">I'm not a robot</span>
        </div>
        <div class="text-right text-xs text-gray-400 leading-none">
            Powered by Stuffnest CAPTCHA <small class="text-xs ml-1" id="version-display">V?</small>
            <div class="mt-1">
            <img src="https://i.imgur.com/C2nZtGf.png" width="25" height="25" alt="">
    
            </div>
        </div>
    </div>
    <a href="https://docs.google.com/document/d/1ItiBmibn6uZUIOjw5CzjBJWZL83y4YspXiltp3MPqmo/edit?usp=sharing">Documentation</a>
    
    <!-- Loading Modal Simulation -->
    <div class="notification-modal" id="loading-modal">
        Analyzing behavior...
    </div>

    <!-- Status Modal -->
    <div class="notification-modal" id="status-modal"></div>

    <!-- Challenge Popup -->
    <div class="challenge-popup" id="challenge-popup">
        <div class="challenge-box">
            <div class="challenge-header" id="challenge-text">Challenge Loading...</div>
            <div class="challenge-content" id="challenge-content-area">
                <div class="status-message hidden mt-3 p-2 text-sm rounded-md text-center" id="status-message"></div>
            </div>
            <div class="challenge-footer flex justify-between items-center p-4 border-t border-gray-200">
                <div class="refresh-icon cursor-pointer text-gray-500 hover:text-gray-900 transition-colors" 
                     onclick="generateChallenge()" title="Get new challenge">
                    <img src="https://i.imgur.com/TB8Exgi.png" width="75" height="75" alt="">
                </div>
                <button class="verify-button bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition-colors" 
                        onclick="verifyChallenge()">VERIFY</button>
            </div>
        </div>
    </div>

    <!-- Simulated Embedder Console -->
    <div class="embedder-console", style="display: none;">
        <h3 class="text-white font-semibold mb-2">Console</h3>
        <div id="embedder-log">
            <div class="log-line">Waiting for API call...</div>
        </div>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
